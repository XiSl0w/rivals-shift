name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@22
          cache: true

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag ${{ github.ref_name }} does not match package version $packageVersion."
          }

      - name: Type-check
        run: pnpm typecheck

      - name: Build test targets
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Package update-enabled installers
        run: pnpm dist
        env:
          RIVAL_SHIFT_UPDATE_URL: https://github.com/XiSl0w/rivals-shift/releases/latest/download/
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Rival Shift Setup *.exe
            release/Rival Shift Payload *.exe
            release/Rival Shift Payload *.exe.blockmap
            release/latest.yml
